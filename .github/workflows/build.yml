name: Build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make wrapper executable
        run: chmod +x ./gradlew
      - name: Run JVM checks
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

  assemble-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Make wrapper executable
        run: chmod +x ./gradlew
      - name: Decode release keystore when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.CAMPUSTRADE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          fi
      - name: Assemble release APK
        env:
          CAMPUSTRADE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          CAMPUSTRADE_KEYSTORE_PASSWORD: ${{ secrets.CAMPUSTRADE_KEYSTORE_PASSWORD }}
          CAMPUSTRADE_KEY_ALIAS: ${{ secrets.CAMPUSTRADE_KEY_ALIAS }}
          CAMPUSTRADE_KEY_PASSWORD: ${{ secrets.CAMPUSTRADE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: campus-trade-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
