name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for embedded relay or provider secrets
        run: |
          if grep -RInE 'INVOICE_EMAIL_SECRET|HELPER_AI_KEY|HELPER_AI_URL|HELPER_AI_MODEL|This_is_for_campusTrade' app/src/main; then
            echo "An embedded relay/provider secret marker was found."
            exit 1
          fi
          echo "No embedded relay/provider secret markers found."

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Make wrapper executable
        run: chmod +x ./gradlew
      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace
