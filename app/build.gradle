plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}

// Release signing is optional locally. CI or a release machine can provide
// these through local.properties or environment variables.
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) localProps.load(new FileInputStream(localPropsFile))
def releaseStorePath = (localProps.getProperty("CAMPUSTRADE_KEYSTORE_PATH")
        ?: System.getenv("CAMPUSTRADE_KEYSTORE_PATH") ?: "").toString()
def releaseStorePassword = (localProps.getProperty("CAMPUSTRADE_KEYSTORE_PASSWORD")
        ?: System.getenv("CAMPUSTRADE_KEYSTORE_PASSWORD") ?: "").toString()
def releaseKeyAlias = (localProps.getProperty("CAMPUSTRADE_KEY_ALIAS")
        ?: System.getenv("CAMPUSTRADE_KEY_ALIAS") ?: "").toString()
def releaseKeyPassword = (localProps.getProperty("CAMPUSTRADE_KEY_PASSWORD")
        ?: System.getenv("CAMPUSTRADE_KEY_PASSWORD") ?: "").toString()
def hasReleaseSigning = !releaseStorePath.isEmpty() && !releaseStorePassword.isEmpty()
        && !releaseKeyAlias.isEmpty() && !releaseKeyPassword.isEmpty()
        && rootProject.file(releaseStorePath).exists()

android {
    namespace "com.campustrade.auth"
    compileSdk 34

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.campustrade.auth"
        minSdk 23
        targetSdk 34
        versionCode 9
        versionName "1.5.3"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // Pure-JVM checks only. Android framework methods are not exercised by the tests.
        unitTests.returnDefaultValues = true
    }

    buildTypes {
        debug {
            // Moderator passcode is read from the Gradle property
            //   campustradeAdminPasscode=<something private>
            // Do not commit a real passcode. Keep it in user-level Gradle properties
            // or pass it on the command line for local assessment/demo builds.
            def adminPasscode = (project.findProperty("campustradeAdminPasscode") ?: "").toString()
            buildConfigField "String", "ADMIN_PASSCODE", "\"${adminPasscode.replace('\\', '\\\\').replace('"', '\\"')}\""
        }
        release {
            // Admin tools never exist in release builds.
            buildConfigField "String", "ADMIN_PASSCODE", "\"\""
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-appcheck'
    implementation 'com.google.firebase:firebase-appcheck-debug'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    implementation 'com.google.android.play:integrity:1.3.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    testImplementation 'junit:junit:4.13.2'
}
