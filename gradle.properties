android.useAndroidX=true
android.nonTransitiveRClass=true

# The admin passcode is NOT stored here. For builds that need moderator access,
# set it in your user-level Gradle properties instead:
#   ~/.gradle/gradle.properties   (or %USERPROFILE%\.gradle\gradle.properties on Windows)
#   campustradeAdminPasscode=YOUR_ADMIN_PASSCODE_HERE
# or pass it on the command line:
#   gradlew.bat assembleDebug -PcampustradeAdminPasscode=YOUR_ADMIN_PASSCODE_HERE
# Builds without an admin passcode keep the moderator tools locked.

